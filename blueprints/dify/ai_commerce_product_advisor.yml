app:
  name: "AI-Commerce Product Advisor & Inventory Workflow"
  mode: "workflow"
  description: "Classifies shopper intent, queries live catalog API, and drafts personalized bundles."
  version: "0.1.5"
workflow:
  graph:
    nodes:
      - id: "start"
        type: "start"
        title: "Shopper Query & Cart Context"
      - id: "intent_classifier"
        type: "question-classifier"
        title: "Classify Intent (Discovery / Spec Compare / Order Support)"
      - id: "catalog_lookup"
        type: "http-request"
        title: "Query Catalog & Stock API"
        url: "${ECOMMERCE_CATALOG_API_URL}"
      - id: "llm_recommender"
        type: "llm"
        title: "Generate Grounded Product Recommendation"
        model: "amazon.nova-pro"
      - id: "end"
        type: "end"
        title: "Structured JSON Recommendation Output"
    edges:
      - source: "start"
        target: "intent_classifier"
      - source: "intent_classifier"
        target: "catalog_lookup"
      - source: "catalog_lookup"
        target: "llm_recommender"
      - source: "llm_recommender"
        target: "end"
