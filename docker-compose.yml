services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpass}
      POSTGRES_DB: ${POSTGRES_DB:-dify_n8n_platform}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localredispass}"]
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:1.78.0
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-dify_n8n_platform}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aiops_admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-localdevpass}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-encryption-key-32-bytes}
      GENERIC_TIMEZONE: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
